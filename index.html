<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CS2 Trade Banned Accounts</title>
<style>
  :root{
    --bg:#0b0f14;
    --bg2:#111822;
    --bg3:#16202d;
    --panel:#172231;
    --panel2:#1b2838;
    --line:#2a475e;
    --line2:#1d3346;
    --text:#c6d4df;
    --muted:#8ba0b0;
    --accent:#66c0f4;
    --accent2:#1a9fff;
    --green:#a4d007;
    --green2:#c2e05a;
    --shadow:0 16px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{
    scroll-behavior:smooth;
    background:#081017;
  }
  body{
    margin:0;
    position:relative;
    font-family:Arial,Helvetica,sans-serif;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(26,159,255,.10), transparent 55%),
      radial-gradient(900px 500px at 100% 100%, rgba(164,208,7,.08), transparent 50%),
      linear-gradient(180deg, #081017 0%, var(--bg) 100%);
    background-color:#081017;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  body.detail-mobile-open{
    overflow:hidden;
    overscroll-behavior:none;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(120deg, transparent 0%, rgba(102,192,244,.04) 18%, transparent 36%),
      linear-gradient(300deg, transparent 0%, rgba(102,192,244,.03) 20%, transparent 40%);
    transform:translateZ(0);
    animation:floatGlow 16s ease-in-out infinite alternate;
    opacity:.9;
  }
  html.is-scrolling body::before{
    animation-play-state:paused;
    opacity:.35;
  }
  @keyframes floatGlow{
    0%{transform:translate3d(-1%,0,0)}
    100%{transform:translate3d(1%,0,0)}
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(11,15,20,.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(42,71,94,.75);
  }
  html.is-scrolling .topbar{
    background:rgba(11,15,20,.97);
    backdrop-filter:none;
  }
  .topbar-inner{
    max-width:1400px;
    margin:0 auto;
    padding:14px 20px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .brand-badge{
    width:42px;height:42px;border-radius:10px;
    display:grid;place-items:center;
    background:linear-gradient(135deg, rgba(26,159,255,.95), rgba(13,110,175,.95));
    box-shadow:0 10px 24px rgba(26,159,255,.18);
    flex:0 0 auto;
    transform:translateZ(0);
    animation:pulseBadge 3.6s ease-in-out infinite;
  }
  @keyframes pulseBadge{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
  }
  .brand-text{min-width:0}
  .brand-title{
    font-size:14px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#fff;
  }
  .brand-sub{
    margin-top:3px;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .topbar-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:10px;
  }
  .tg-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    border-radius:10px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg, #0088cc, #006fa6);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 24px rgba(0,136,204,.18);
    font-weight:700;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    white-space:nowrap;
  }
  .tg-btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(0,136,204,.28);filter:saturate(1.05)}
  .tg-btn.secondary{
    background:linear-gradient(135deg, rgba(27,40,56,.98), rgba(21,33,46,.98));
    border-color:rgba(102,192,244,.24);
    box-shadow:0 10px 24px rgba(0,0,0,.2);
  }
  .tg-btn.secondary:hover{
    box-shadow:0 14px 30px rgba(0,0,0,.28);
  }
  .hero{
    max-width:1400px;
    margin:0 auto;
    padding:24px 20px 6px;
    display:flex;
    flex-wrap:wrap;
    align-items:end;
    justify-content:space-between;
    gap:16px;
  }
  .hero h1{
    margin:0;
    font-size:clamp(26px,4vw,42px);
    line-height:1.05;
    letter-spacing:-.02em;
    color:#fff;
  }
  .hero h1 span{color:var(--accent)}
  .hero p{
    margin:10px 0 0;
    color:var(--muted);
    max-width:700px;
    line-height:1.5;
    font-size:14px;
  }
  .count-pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(26,159,255,.10);
    border:1px solid rgba(102,192,244,.22);
    color:var(--accent);
    font-weight:700;
    font-size:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }

  .shell{
    max-width:1400px;
    margin:0 auto;
    padding:14px 20px 28px;
    display:grid;
    grid-template-columns:280px 1fr;
    gap:18px;
    position:relative;
    z-index:1;
  }
  .sidebar,
  .main{
    min-width:0;
  }
  .panel{
    background:linear-gradient(180deg, rgba(23,34,49,.96), rgba(18,24,34,.96));
    border:1px solid rgba(42,71,94,.85);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .panel.detail-overlay-host{
    overflow:visible;
  }
  .panel-head{
    padding:14px 16px;
    border-bottom:1px solid rgba(42,71,94,.75);
    background:rgba(27,40,56,.72);
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .panel-head-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .clear-filters-btn{
    border:1px solid rgba(102,192,244,.28);
    background:rgba(17,24,34,.72);
    color:var(--text);
    border-radius:999px;
    padding:6px 9px;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .clear-filters-btn:hover{
    transform:translateY(-1px);
    border-color:rgba(102,192,244,.62);
    background:rgba(26,159,255,.12);
  }

  .filters{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:12px;
  }
  .filter{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    border:1px solid rgba(42,71,94,.7);
    background:rgba(17,24,34,.72);
    color:var(--text);
    padding:10px 12px;
    border-radius:12px;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    user-select:none;
    text-align:left;
  }
  .filter:hover{
    transform:translateY(-1px);
    border-color:rgba(102,192,244,.55);
    box-shadow:0 8px 20px rgba(0,0,0,.18);
  }
  .filter.active{
    background:linear-gradient(135deg, rgba(26,159,255,.18), rgba(22,32,45,.85));
    border-color:rgba(26,159,255,.8);
  }
  .filter-dot{
    width:11px;height:11px;border-radius:999px;
    background:rgba(139,160,176,.35);
    box-shadow:0 0 0 3px rgba(139,160,176,.08);
    flex:0 0 auto;
  }
  .filter.active .filter-dot{
    background:var(--accent);
    box-shadow:0 0 0 3px rgba(102,192,244,.18);
  }
  .filter span{font-size:14px;font-weight:700;line-height:1.2}

  .price-filter{
    padding:12px 12px 14px;
    border:1px solid rgba(42,71,94,.7);
    background:rgba(17,24,34,.72);
    border-radius:12px;
  }
  .price-filter-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
    color:var(--text);
    font-size:13px;
    font-weight:800;
  }
  .price-filter-value{
    color:var(--accent);
    white-space:nowrap;
  }
  .price-histogram{
    height:42px;
    display:flex;
    align-items:flex-end;
    gap:3px;
    padding:0 2px;
    margin-bottom:8px;
  }
  .price-bar{
    flex:1 1 0;
    min-width:2px;
    border-radius:3px 3px 0 0;
    background:rgba(139,160,176,.22);
  }
  .range-wrap {
    position: relative;
    height: 28px;
    margin-top: 10px;
    touch-action: none; /* Prevents mobile page scrolling while dragging */
  }
  .range-track,
  .range-fill {
    position: absolute;
    left: 0;
    right: 0;
    top: 12px;
    height: 4px;
    border-radius: 999px;
  }
  .range-track { background: rgba(139, 160, 176, .24); }
  .range-fill { background: var(--accent); }
  .range-input {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 28px;
    margin: 0;
    background: none;
    pointer-events: none;
    appearance: none;
    -webkit-appearance: none;
  }
  .range-input::-webkit-slider-thumb {
    position: relative;
    z-index: 2;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #087bff;
    border: 2px solid var(--bg2);
    cursor: grab;
    pointer-events: auto;
    appearance: none;
    -webkit-appearance: none;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
    transition: transform 0.1s ease, background-color 0.1s ease;
  }
  .range-input::-webkit-slider-thumb:active {
    cursor: grabbing;
    transform: scale(1.2);
    background: var(--accent);
  }
  .range-input::-moz-range-thumb {
    position: relative;
    z-index: 2;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #087bff;
    border: 2px solid var(--bg2);
    cursor: grab;
    pointer-events: auto;
    box-shadow: 0 3px 10px rgba(0,0,0,.35);
    transition: transform 0.1s ease, background-color 0.1s ease;
  }
  .range-input::-moz-range-thumb:active {
    cursor: grabbing;
    transform: scale(1.2);
    background: var(--accent);
  }
  .range-input::-moz-range-track{background:transparent;border:0}

  .filter-group{
    border:1px solid rgba(42,71,94,.7);
    background:rgba(17,24,34,.72);
    border-radius:12px;
    overflow:hidden;
  }
  .filter-group-head{
    width:100%;
    border:0;
    background:none;
    color:var(--text);
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    cursor:pointer;
  }
  .filter-check{
    width:16px;
    height:16px;
    accent-color:#1a9fff;
    flex:0 0 auto;
  }
  .filter-group-title{
    flex:1 1 auto;
    min-width:0;
    font-size:14px;
    font-weight:800;
  }
  .filter-chevron{
    width:18px;
    height:18px;
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--muted);
    transition:transform .18s ease;
  }
  .filter-group.open .filter-chevron{transform:rotate(90deg)}
  .filter-sublist{
    display:none;
    padding:0 10px 10px 34px;
    gap:6px;
    flex-direction:column;
  }
  .filter-group.open .filter-sublist{display:flex}
  .filter-option{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:30px;
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .filter-option-count{
    margin-left:auto;
    color:var(--muted);
    font-size:11px;
  }

  .sort-wrap{
    position:relative;
  }
  .sort-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    z-index:10;
    min-width:190px;
    padding:8px;
    border:1px solid rgba(42,71,94,.8);
    border-radius:12px;
    background:rgba(17,24,34,.98);
    box-shadow:0 18px 34px rgba(0,0,0,.32);
  }
  .sort-option{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .toolbar{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .search-wrap{
    flex:1 1 280px;
    position:relative;
  }
  .search-wrap svg{
    position:absolute;
    left:13px; top:50%; transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
  }
  .search{
    width:100%;
    padding:13px 14px 13px 40px;
    border-radius:14px;
    border:1px solid rgba(42,71,94,.8);
    background:rgba(17,24,34,.86);
    color:var(--text);
    outline:none;
    font-size:14px;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  .search:focus{
    border-color:rgba(102,192,244,.9);
    box-shadow:0 0 0 4px rgba(26,159,255,.08);
  }
  .search::placeholder{color:var(--muted)}

  .chips{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .chip{
    padding:10px 12px;
    border-radius:999px;
    border:1px solid rgba(42,71,94,.75);
    background:rgba(17,24,34,.7);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
    user-select:none;
  }
  .chip:hover{transform:translateY(-1px);border-color:rgba(102,192,244,.55)}
  .chip.active{background:rgba(26,159,255,.16);border-color:rgba(26,159,255,.9);color:#fff}
  .scroll-top-fab{
    position:fixed;
    right:max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
    bottom:max(18px, calc(env(safe-area-inset-bottom, 0px) + 18px));
    width:56px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:999px;
    border:1px solid rgba(102,192,244,.34);
    background:linear-gradient(180deg, rgba(26,159,255,.96), rgba(8,121,190,.96));
    color:#fff;
    box-shadow:0 18px 34px rgba(0,0,0,.32), 0 10px 24px rgba(26,159,255,.24);
    cursor:pointer;
    z-index:70;
    opacity:0;
    pointer-events:none;
    transform:translateY(12px) scale(.96);
    transition:opacity .2s ease, transform .2s ease, box-shadow .2s ease, filter .2s ease;
  }
  .scroll-top-fab.visible{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0) scale(1);
  }
  .scroll-top-fab:hover{
    box-shadow:0 22px 38px rgba(0,0,0,.36), 0 14px 30px rgba(26,159,255,.3);
    filter:saturate(1.05);
  }
  .scroll-top-fab svg{
    width:22px;
    height:22px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }
  .card{
    position:relative;
    display:flex;
    flex-direction:column;
    height:100%;
    background:linear-gradient(180deg, rgba(27,40,56,.98), rgba(18,24,34,.98));
    border:1px solid rgba(42,71,94,.85);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,.25);
    transform:translateY(10px);
    opacity:0;
    animation:cardIn .45s ease forwards;
    transition:transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    cursor:pointer;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:rgba(102,192,244,.7);
    box-shadow:0 16px 34px rgba(0,0,0,.34);
  }
  @keyframes cardIn{
    to{transform:translateY(0);opacity:1}
  }
  .thumb{
    position:relative;
    height:175px;
    background:
      linear-gradient(135deg, rgba(15,23,33,.9), rgba(24,37,51,.9)),
      linear-gradient(135deg, #182735, #0f1821);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .thumb::after{
    content:"";
    position:absolute;
    inset:auto -20% -40% -20%;
    height:90px;
    background:radial-gradient(circle at center, rgba(102,192,244,.20), transparent 70%);
    filter:blur(12px);
    animation:shine 5.5s ease-in-out infinite alternate;
  }
  html.is-scrolling .thumb::after{
    animation-play-state:paused;
    opacity:.28;
  }
  @keyframes shine{
    0%{transform:translateX(-6%)}
    100%{transform:translateX(6%)}
  }
  .thumb img{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .35s ease, filter .35s ease;
  }
  .card:hover .thumb img{transform:scale(1.04)}
  .thumb.ph{
    color:rgba(139,160,176,.55);
    font-size:13px;
    font-weight:700;
    letter-spacing:.4px;
  }
  .tag-row{
    position:absolute;
    top:8px; left:8px; right:8px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    z-index:2;
  }
  .tag{
    font-size:9.5px;
    line-height:1;
    padding:5px 7px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:.4px;
    text-transform:uppercase;
    background:rgba(11,15,20,.72);
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
    backdrop-filter:blur(10px);
  }
  .tag:nth-child(1){background:rgba(164,208,7,.16);color:var(--green);border-color:rgba(164,208,7,.18)}
  .tag:nth-child(2){background:rgba(102,192,244,.14);color:var(--accent);border-color:rgba(102,192,244,.18)}
  .tag:nth-child(3){background:rgba(255,180,0,.13);color:#ffc84a;border-color:rgba(255,180,0,.18)}
  .tag:nth-child(4){background:rgba(130,100,255,.14);color:#b8a8ff;border-color:rgba(130,100,255,.18)}

  .card-body{
    display:flex;
    flex:1;
    flex-direction:column;
    padding:14px;
  }
  .title{
    margin:0;
    font-size:15px;
    line-height:1.35;
    color:#fff;
    font-weight:800;
  }
  .title-line{
    display:block;
  }
  .desc{
    margin:7px 0 0;
    font-size:12px;
    line-height:1.45;
    color:var(--muted);
    min-height:2.9em;
    white-space:pre-line;
  }
  .meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:auto;
    padding-top:12px;
  }
  .price{
    font-size:22px;
    line-height:1;
    font-weight:900;
    color:var(--green);
    letter-spacing:-.02em;
  }
  .buy{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:10px 12px;
    border-radius:12px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(135deg, #0088cc, #006fa6);
    font-size:13px;
    font-weight:800;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    white-space:nowrap;
    box-shadow:0 10px 18px rgba(0,136,204,.16);
  }
  .buy:hover{transform:translateY(-1px);box-shadow:0 14px 22px rgba(0,136,204,.22);filter:saturate(1.05)}

  .empty{
    grid-column:1/-1;
    padding:54px 18px;
    text-align:center;
    color:var(--muted);
    border:1px dashed rgba(42,71,94,.9);
    border-radius:18px;
    background:rgba(17,24,34,.45);
  }
  .empty h3{margin:0 0 8px;color:#fff}

  .detail-view{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .detail-view.is-overlay{
    position:fixed;
    inset:0;
    z-index:60;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 24px);
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(26,159,255,.10), transparent 55%),
      radial-gradient(900px 500px at 100% 100%, rgba(164,208,7,.08), transparent 50%),
      linear-gradient(180deg, #081017 0%, var(--bg) 100%);
  }
  .detail-shell{

<script src="steamtradeban_items.js"></script>
<script>
  const sellerLink = 'https://t.me/SsKrasavaSs';

  const items = window.catalogItems || [];
  const gunsOnlyItemNames = [
    'StatTrak AK-47 | Neon Rider + Guns',
    'AWP | Containment Breach+Guns',
    'Specialist Glove + Guns'
  ];
  const priceStep = 10;
  const knifeTypes = [
    { id: 'butterfly', label: 'Butterfly', pattern: /\bButterfly\b/i },
    { id: 'm9', label: 'M9', pattern: /\bM9\b/i },
    { id: 'talon', label: 'Talon', pattern: /\bTalon\b/i },
    { id: 'bowie', label: 'Bowie', pattern: /\bBowie\b/i },
    { id: 'navaja', label: 'Navaja', pattern: /\bNavaja\b/i },
    { id: 'skeleton', label: 'Skeleton', pattern: /\bSkeleton\b/i },
    { id: 'ursus', label: 'Ursus', pattern: /\bUrsus\b/i },
    { id: 'classic', label: 'Classic', pattern: /\bClassic\b/i },
    { id: 'stiletto', label: 'Stiletto', pattern: /\bStiletto\b/i },
    { id: 'bayonet', label: 'Bayonet', pattern: /(^|[^a-z0-9])Bayonet\b/i },
    { id: 'karambit', label: 'Karambit', pattern: /\bKarambit\b/i },
    { id: 'survival', label: 'Survival', pattern: /\bSurvival\b/i },
    { id: 'falchion', label: 'Falchion', pattern: /\bFalchion\b/i },
    { id: 'kukri', label: 'Kukri', pattern: /\bKukri\b/i },
    { id: 'paracord', label: 'Paracord', pattern: /\bParacord\b/i },
    { id: 'huntsman', label: 'Huntsman', pattern: /\bHuntsman\b/i },
    { id: 'shadow-daggers', label: 'Shadow Daggers', pattern: /\bShadow Daggers\b/i },
    { id: 'flip', label: 'Flip', pattern: /\bFlip\b/i },
    { id: 'gut', label: 'Gut', pattern: /\bGut\b/i },
    { id: 'nomad', label: 'Nomad', pattern: /\bNomad\b/i }
  ];

  let activeGroups = [];
  let activeKnifeTypes = {
    knife: [],
    knifeGloves: []
  };
  let expandedGroups = [];
  let sortOrder = 'asc';
  let priceRange = getDefaultPriceRange();
  let selectedItemId = getItemIdFromHash();
  let catalogScrollY = typeof history.state?.catalogScrollY === 'number' ? history.state.catalogScrollY : 0;
  const mobileDetailQuery = window.matchMedia('(max-width: 768px)');
  let scrollingEffectsTimer = 0;

  function getCurrentScrollY() {
    return window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
  }

  function markScrollingActivity() {
    document.documentElement.classList.add('is-scrolling');
    window.clearTimeout(scrollingEffectsTimer);
    scrollingEffectsTimer = window.setTimeout(() => {
      document.documentElement.classList.remove('is-scrolling');
    }, 140);
  }

  function isMobileDetailLayout() {
    return mobileDetailQuery.matches;
  }

  function afterLayout(callback) {
    window.requestAnimationFrame(() => window.requestAnimationFrame(callback));
  }

  function getDetailScrollHost(detailView = document.getElementById('detailView')) {
    return detailView?.classList.contains('is-overlay') ? detailView : window;
  }

  function getScrollHostTop(scrollHost) {
    return scrollHost === window ? getCurrentScrollY() : scrollHost.scrollTop;
  }

  function scrollHostTo(scrollHost, top, behavior = 'auto') {
    if (scrollHost === window) {
      window.scrollTo({ top, behavior });
      return;
    }

    scrollHost.scrollTo({ top, behavior });
  }

  function getElementPositionWithinHost(element, scrollHost, edge = 'top') {
    if (!element) return 0;

    const rect = element.getBoundingClientRect();
    const hostTop = scrollHost === window ? 0 : scrollHost.getBoundingClientRect().top;
    const currentTop = getScrollHostTop(scrollHost);
    const point = edge === 'bottom' ? rect.bottom : rect.top;

    return point - hostTop + currentTop;
  }

  function updateScrollTopButtonVisibility() {
    const button = document.getElementById('floatingTopBtn');
    if (!button) return;

    const shouldShow = selectedItemId == null && getCurrentScrollY() > 220;
    button.classList.toggle('visible', shouldShow);
  }

  function scrollCatalogToTop(behavior = 'smooth') {
    if (selectedItemId != null) return;
    window.scrollTo({ top: 0, behavior });
  }

  function scrollToElementTop(element, behavior = 'auto', offset = 0, scrollHost = window) {
    if (!element) return;

    afterLayout(() => {
      const top = Math.max(getElementPositionWithinHost(element, scrollHost) - offset, 0);
      scrollHostTo(scrollHost, top, behavior);
    });
  }

  function scrollToDetailView(behavior = 'auto') {
    const detailView = document.getElementById('detailView');
    const detailMedia = detailView?.querySelector('.detail-media');
    const detailPriceBox = detailView?.querySelector('.detail-price-box');
    const scrollHost = getDetailScrollHost(detailView);

    if (!detailView || detailView.hidden) return;

    if (isMobileDetailLayout() && detailMedia && detailPriceBox) {
      afterLayout(() => {
        const viewportHeight = scrollHost === window ? window.innerHeight : detailView.clientHeight;
        const mediaTop = getElementPositionWithinHost(detailMedia, scrollHost, 'top');
        const priceBottom = getElementPositionWithinHost(detailPriceBox, scrollHost, 'bottom');
        const maxTarget = Math.max(mediaTop - 40, 0);
        const preferredTarget = Math.max(priceBottom - viewportHeight - 20, 0);
        const targetTop = Math.min(preferredTarget, maxTarget);

        scrollHostTo(scrollHost, targetTop, behavior);
      });
      return;
    }

    afterLayout(() => scrollHostTo(scrollHost, 0, behavior));
  }

  function restoreCatalogScroll(behavior = 'auto') {
    afterLayout(() => {
      if (behavior === 'instant') {
        const root = document.documentElement;
        const body = document.body;
        const previousRootBehavior = root.style.scrollBehavior;
        const previousBodyBehavior = body.style.scrollBehavior;

        root.style.scrollBehavior = 'auto';
        body.style.scrollBehavior = 'auto';
        window.scrollTo({ top: Math.max(catalogScrollY, 0), behavior: 'auto' });

        window.requestAnimationFrame(() => {
          root.style.scrollBehavior = previousRootBehavior;
          body.style.scrollBehavior = previousBodyBehavior;
        });
        return;
      }

      window.scrollTo({ top: Math.max(catalogScrollY, 0), behavior });
    });
  }

  function getCatalogUrl() {
    return `${window.location.pathname}${window.location.search}`;
  }

  function buildHistoryState(view, options = {}) {
    return {
      view,
      itemId: view === 'detail' ? selectedItemId : null,
      catalogScrollY,
      fromCatalog: Boolean(options.fromCatalog)
    };
  }

  function syncHistoryState(view, options = {}) {
    const url = view === 'detail' && selectedItemId ? `#item-${selectedItemId}` : getCatalogUrl();
    history.replaceState(buildHistoryState(view, options), '', url);
  }

  function priceValue(value) {
    const num = String(value || '').replace(/[^0-9.]/g, '');
    return num ? Number(num) : Number.POSITIVE_INFINITY;
  }

  function isItemSold(item) {
    return !Number.isFinite(priceValue(item.price));
  }

  function roundDownToStep(value) {
    return Math.floor(value / priceStep) * priceStep;
  }

  function roundUpToStep(value) {
    return Math.ceil(value / priceStep) * priceStep;
  }

  function getFinitePrices() {
    return items
      .map(item => priceValue(item.price))
      .filter(Number.isFinite);
  }

  function getDefaultPriceRange() {
    const prices = getFinitePrices();
    if (!prices.length) return { min: 0, max: priceStep };

    const min = roundDownToStep(Math.min(...prices));
    const max = roundUpToStep(Math.max(...prices));
    return { min, max: Math.max(max, min + priceStep) };
  }

  function clampPriceRange(min, max) {
    const bounds = getDefaultPriceRange();
    const nextMin = Math.min(Math.max(roundDownToStep(Number(min)), bounds.min), bounds.max - priceStep);
    const nextMax = Math.max(Math.min(roundUpToStep(Number(max)), bounds.max), bounds.min + priceStep);

    if (nextMin >= nextMax) {
      return { min: Math.max(bounds.min, nextMax - priceStep), max: nextMax };
    }

    return { min: nextMin, max: nextMax };
  }

  function formatPrice(value) {
    return `$${Number(value).toLocaleString('en-US')}`;
  }

  function itemText(item) {
    return `${item.name || ''} ${item.desc || ''}`;
  }

  function getItemKnifeTypes(item) {
    const text = itemText(item);
    const hasM9 = /\bM9\b/i.test(text);

    return knifeTypes
      .filter(type => {
        if (type.id === 'bayonet' && hasM9) return false;
        return type.pattern.test(text);
      })
      .map(type => type.id);
  }

  function itemHasKnife(item) {
    return getItemKnifeTypes(item).length > 0 || /\b(Knife|Knives)\b/i.test(itemText(item));
  }

  function itemHasGloves(item) {
    return /\bGlove(s)?\b/i.test(itemText(item)) || item.cats?.includes(1);
  }

  function itemHasGuns(item) {
    return gunsOnlyItemNames.includes(String(item.name || '').trim());
  }

  function itemInGroup(item, groupId) {
    if (groupId === 'knife') return itemHasKnife(item) && !itemHasGloves(item);
    if (groupId === 'knifeGloves') return itemHasKnife(item) && itemHasGloves(item);
    if (groupId === 'guns') return itemHasGuns(item);
    return false;
  }

  function getAvailableKnifeTypes(groupId) {
    return knifeTypes
      .map(type => ({
        ...type,
        count: items.filter(item => !isItemSold(item) && itemInGroup(item, groupId) && getItemKnifeTypes(item).includes(type.id)).length
      }))
      .filter(type => type.count > 0)
      .sort((a, b) => a.label.localeCompare(b.label));
  }

  function getGroupCount(groupId) {
    return items.filter(item => !isItemSold(item) && itemInGroup(item, groupId)).length;
  }

  function matchesQuery(item, q) {
    if (!q) return true;
    const haystack = `${item.name} ${item.price} ${item.desc}`.toLowerCase();
    return haystack.includes(q);
  }

  function getItemIdFromHash() {
    const match = window.location.hash.match(/^#item-(\d+)$/);
    return match ? Number(match[1]) : null;
  }

  function getItemById(id) {
    return items.find(item => item.id === id) || null;
  }

  function buildTags(item) {
    const tags = [];
    const knifeLabels = getItemKnifeTypes(item)
      .map(id => knifeTypes.find(type => type.id === id)?.label)
      .filter(Boolean);

    if (itemInGroup(item, 'knifeGloves')) tags.push('Knife + Gloves');
    else if (itemInGroup(item, 'knife')) tags.push('Knife');
    if (itemHasGuns(item)) tags.push('Guns');
    tags.push(...knifeLabels);

    return [...new Set(tags)]
      .slice(0, 4)
      .map(tag => `<span class="tag">${escapeHtml(tag)}</span>`)
      .join('');
  }

  function formatTitle(name) {
    return String(name || '')
      .split('|')
      .map(part => part.trim())
      .filter(Boolean)
      .map(part => `<span class="title-line">${escapeHtml(part)}</span>`)
      .join('');
  }

  function matchesActiveCategories(item) {
    const selectedGroups = new Set(activeGroups);
    const selectedTypeGroups = Object.entries(activeKnifeTypes)
      .filter(([, types]) => types.length)
      .map(([group]) => group);

    selectedTypeGroups.forEach(group => selectedGroups.add(group));

    if (!selectedGroups.size) return true;

    return [...selectedGroups].some(group => {
      if (!itemInGroup(item, group)) return false;

      const selectedTypes = activeKnifeTypes[group] || [];
      if (!selectedTypes.length) return true;

      const itemTypes = getItemKnifeTypes(item);
      return selectedTypes.some(type => itemTypes.includes(type));
    });
  }

  function matchesPriceRange(item) {
    const value = priceValue(item.price);
    return Number.isFinite(value) && value >= priceRange.min && value <= priceRange.max;
  }

  function buildThumbImage(item) {
    return item.img
      ? `<img src="${item.img}" alt="${escapeHtml(item.name)}" loading="lazy" decoding="async">`
      : `<div class="thumb ph">No image</div>`;
  }

  function buildDetailImage(item) {
    return item.img
      ? `<img src="${item.img}" alt="${escapeHtml(item.name)}" loading="eager" decoding="async">`
      : 'No image';
  }

  function placeDetailView(useOverlay) {
    const detailView = document.getElementById('detailView');
    const detailMount = document.getElementById('detailMount');

    if (!detailView || !detailMount) return detailView;

    const targetParent = useOverlay ? document.body : detailMount;

    if (detailView.parentElement !== targetParent) {
      targetParent.appendChild(detailView);
    }

    return detailView;
  }

  function renderCatalog() {
    renderFilters();

    const q = document.getElementById('search').value.trim().toLowerCase();
    const grid = document.getElementById('grid');

    let filtered = [...items];

    filtered = filtered.filter(matchesPriceRange);
    filtered = filtered.filter(matchesActiveCategories);

    filtered = filtered.filter(item => matchesQuery(item, q));
    filtered.sort((a, b) => {
      const diff = priceValue(a.price) - priceValue(b.price);
      return sortOrder === 'desc' ? -diff : diff;
    });

    document.getElementById('countPill').textContent = `${filtered.length} item${filtered.length === 1 ? '' : 's'} shown`;

    if (!filtered.length) {
      grid.innerHTML = `
        <div class="empty">
          <h3>No items found</h3>
          <div>Try another search or clear filters.</div>
        </div>
      `;
      return;
    }

    grid.innerHTML = filtered.map((item, index) => {
      const tags = buildTags(item);
      const image = buildThumbImage(item);

      return `
        <article class="card" style="animation-delay:${Math.min(index * 40, 360)}ms" role="link" tabindex="0" aria-label="Open ${escapeHtml(item.name)}" onclick="openItem(${item.id})" onkeydown="handleCardKey(event, ${item.id})">
          <div class="thumb">
            ${image}
            <div class="tag-row">${tags}</div>
          </div>
          <div class="card-body">
            <h2 class="title">${formatTitle(item.name)}</h2>
            <div class="desc">${escapeHtml(item.desc || '')}</div>
            <div class="meta">
              <div class="price">${escapeHtml(item.price)}</div>
              <a class="buy" href="${sellerLink}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Buy</a>
            </div>
          </div>
        </article>
      `;
    }).join('');
  }

  function renderDetailView() {
    const catalogView = document.getElementById('catalogView');
    const detailView = document.getElementById('detailView');
    const detailHostPanel = document.getElementById('detailMount')?.closest('.panel');
    const selectedItem = getItemById(selectedItemId);

    if (!selectedItem) {
      selectedItemId = null;
      placeDetailView(false);
      document.body.classList.remove('detail-mobile-open');
      detailHostPanel?.classList.remove('detail-overlay-host');
      catalogView.hidden = false;
      detailView.hidden = true;
      detailView.classList.remove('is-overlay');
      detailView.innerHTML = '';
      updateScrollTopButtonVisibility();
      return;
    }

    const useOverlay = isMobileDetailLayout();
    placeDetailView(useOverlay);

    document.body.classList.toggle('detail-mobile-open', useOverlay);
    detailHostPanel?.classList.toggle('detail-overlay-host', useOverlay);
    catalogView.hidden = !useOverlay;
    detailView.hidden = false;
    detailView.classList.toggle('is-overlay', useOverlay);
    detailView.innerHTML = `
      <div class="detail-shell">
        <div class="detail-head">
          <button type="button" class="back-btn" onclick="closeItem()">&larr; Back to catalog</button>
        </div>
        <div class="detail-layout">
          <div class="detail-media${selectedItem.img ? '' : ' ph'}">
            ${buildDetailImage(selectedItem)}
          </div>
          <div class="detail-info">
            <div class="detail-tag-row">${buildTags(selectedItem)}</div>
            <h2 class="detail-title">${formatTitle(selectedItem.name)}</h2>
            <div class="detail-desc">${escapeHtml(selectedItem.desc || 'No description')}</div>
            <div class="detail-price-box">
              <div class="detail-price-label">Price</div>
              <div class="detail-price">${escapeHtml(selectedItem.price)}</div>
            </div>
            <a class="buy detail-buy" href="${sellerLink}" target="_blank" rel="noopener noreferrer">Buy via Telegram</a>
          </div>
        </div>
      </div>
    `;

    if (useOverlay) {
      detailView.scrollTop = 0;
      restoreCatalogScroll('auto');
    }

    updateScrollTopButtonVisibility();
  }

  function openItem(id, options = {}) {
    const item = getItemById(id);
    if (!item) return;

    const openedFromCatalog = selectedItemId == null;

    if (selectedItemId == null) {
      catalogScrollY = getCurrentScrollY();
      syncHistoryState('catalog');
    }

    selectedItemId = item.id;

    if (options.updateHistory !== false) {
      history.pushState(buildHistoryState('detail', { fromCatalog: openedFromCatalog }), '', `#item-${item.id}`);
    } else {
      syncHistoryState('detail', { fromCatalog: history.state?.fromCatalog });
    }

    renderDetailView();
    scrollToDetailView(options.scrollBehavior ?? 'auto');
  }

  function closeItem(options = {}) {
    const useHistoryBack = options.updateHistory !== false && history.state?.view === 'detail' && history.state?.fromCatalog;

    if (useHistoryBack) {
      selectedItemId = null;
      renderDetailView();

      if (!isMobileDetailLayout()) {
        restoreCatalogScroll('instant');
      }

      window.requestAnimationFrame(() => {
        history.back();
      });
      return;
    }

    selectedItemId = null;

    if (options.updateHistory !== false) {
      syncHistoryState('catalog');
    } else {
      syncHistoryState('catalog');
    }

    renderDetailView();

    if (!isMobileDetailLayout()) {
      restoreCatalogScroll(options.scrollBehavior ?? 'instant');
    }
  }

  function handleCardKey(event, id) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openItem(id);
    }
  }

  function renderFilters() {
    const el = document.getElementById('filters');
    
    // Create price filter container and category wrapper exactly once to avoid losing drag focus
    let priceFilterBox = el.querySelector('.price-filter');
    if (!priceFilterBox) {
      el.innerHTML = ''; // Clear only once on initialization
      renderPriceFilter(el);
      
      const catsContainer = document.createElement('div');
      catsContainer.className = 'categories-list';
      catsContainer.style.display = 'flex';
      catsContainer.style.flexDirection = 'column';
      catsContainer.style.gap = '8px';
      el.appendChild(catsContainer);
    }
    
    // Dynamically update slider positions and labels without recreating DOM nodes
    const minInput = el.querySelector('#priceMin');
    const maxInput = el.querySelector('#priceMax');
    const bounds = getDefaultPriceRange();
    
    if (minInput && document.activeElement !== minInput) {
      minInput.value = priceRange.min;
    }
    if (maxInput && document.activeElement !== maxInput) {
      maxInput.value = priceRange.max;
    }
    
    const left = ((priceRange.min - bounds.min) / (bounds.max - bounds.min)) * 100;
    const right = ((priceRange.max - bounds.min) / (bounds.max - bounds.min)) * 100;
    
    const rangeFill = el.querySelector('.range-fill');
    if (rangeFill) {
      rangeFill.style.left = left + '%';
      rangeFill.style.right = (100 - right) + '%';
    }
    
    const valueLabel = el.querySelector('.price-filter-value');
    if (valueLabel) {
      valueLabel.textContent = `${formatPrice(priceRange.min)} - ${formatPrice(priceRange.max)}`;
    }
    
    // Re-render categories only
    const catsContainer = el.querySelector('.categories-list');
    if (catsContainer) {
      catsContainer.innerHTML = '';
      renderCategoryGroup(catsContainer, 'knife', 'Knife', true);
      renderCategoryGroup(catsContainer, 'knifeGloves', 'Knife + Gloves', true);
      renderCategoryGroup(catsContainer, 'guns', 'Guns', false);
    }

    const selectedCount = activeGroups.length + activeKnifeTypes.knife.length + activeKnifeTypes.knifeGloves.length;
    document.getElementById('activeState').textContent = selectedCount ? `${selectedCount} selected` : 'All';
  }

  function renderPriceFilter(parent) {
    const bounds = getDefaultPriceRange();
    priceRange = clampPriceRange(priceRange.min, priceRange.max);
    const left = ((priceRange.min - bounds.min) / (bounds.max - bounds.min)) * 100;
    const right = ((priceRange.max - bounds.min) / (bounds.max - bounds.min)) * 100;
    const prices = getFinitePrices();
    const bins = 24;
    const counts = Array.from({ length: bins }, () => 0);
    const span = Math.max(bounds.max - bounds.min, priceStep);

    prices.forEach(price => {
      const index = Math.min(bins - 1, Math.floor(((price - bounds.min) / span) * bins));
      counts[index] += 1;
    });

    const maxCount = Math.max(...counts, 1);
    const box = document.createElement('div');
    box.className = 'price-filter';
    box.innerHTML = `
      <div class="price-filter-head">
        <span>Price</span>
        <span class="price-filter-value">${formatPrice(priceRange.min)} - ${formatPrice(priceRange.max)}</span>
      </div>
      <div class="price-histogram" aria-hidden="true">
        ${counts.map(count => `<span class="price-bar" style="height:${Math.max(10, (count / maxCount) * 42)}px"></span>`).join('')}
      </div>
      <div class="range-wrap">
        <span class="range-track"></span>
        <span class="range-fill" style="left:${left}%;right:${100 - right}%"></span>
        <input class="range-input" id="priceMin" type="range" min="${bounds.min}" max="${bounds.max}" step="${priceStep}" value="${priceRange.min}" aria-label="Minimum price">
        <input class="range-input" id="priceMax" type="range" min="${bounds.min}" max="${bounds.max}" step="${priceStep}" value="${priceRange.max}" aria-label="Maximum price">
      </div>
    `;

    parent.appendChild(box);

    const minInput = box.querySelector('#priceMin');
    const maxInput = box.querySelector('#priceMax');
    const rangeWrap = box.querySelector('.range-wrap');

    // Dynamic z-index prioritizing the thumb closer to the pointer/touch position
    const handleZIndex = (e) => {
      const rect = rangeWrap.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const percent = (clientX - rect.left) / rect.width;
      const hoverValue = bounds.min + percent * (bounds.max - bounds.min);
      
      const distToMin = Math.abs(hoverValue - priceRange.min);
      const distToMax = Math.abs(hoverValue - priceRange.max);
      
      if (distToMin < distToMax) {
        minInput.style.zIndex = '10';
        maxInput.style.zIndex = '9';
      } else {
        minInput.style.zIndex = '9';
        maxInput.style.zIndex = '10';
      }
    };

    rangeWrap.addEventListener('mousemove', handleZIndex);
    rangeWrap.addEventListener('touchmove', handleZIndex, { passive: true });

    minInput.addEventListener('input', event => {
      let val = Math.min(Number(event.target.value), priceRange.max - priceStep);
      priceRange.min = val;
      event.target.value = val;
      
      const nextLeft = ((priceRange.min - bounds.min) / (bounds.max - bounds.min)) * 100;
      box.querySelector('.range-fill').style.left = nextLeft + '%';
      box.querySelector('.price-filter-value').textContent = `${formatPrice(priceRange.min)} - ${formatPrice(priceRange.max)}`;
      
      minInput.style.zIndex = '10';
      maxInput.style.zIndex = '9';
      renderCatalog();
    });

    maxInput.addEventListener('input', event => {
      let val = Math.max(Number(event.target.value), priceRange.min + priceStep);
      priceRange.max = val;
      event.target.value = val;
      
      const nextRight = ((priceRange.max - bounds.min) / (bounds.max - bounds.min)) * 100;
      box.querySelector('.range-fill').style.right = (100 - nextRight) + '%';
      box.querySelector('.price-filter-value').textContent = `${formatPrice(priceRange.min)} - ${formatPrice(priceRange.max)}`;
      
      minInput.style.zIndex = '9';
      maxInput.style.zIndex = '10';
      renderCatalog();
    });
  }

  function renderCategoryGroup(parent, id, label, hasSubtypes) {
    const groupCount = getGroupCount(id);
    if (!groupCount) return;

    const availableTypes = hasSubtypes ? getAvailableKnifeTypes(id) : [];
    const selectedTypes = activeKnifeTypes[id] || [];
    const group = document.createElement('div');
    group.className = `filter-group${expandedGroups.includes(id) ? ' open' : ''}`;
    group.innerHTML = `
      <button type="button" class="filter-group-head" aria-expanded="${expandedGroups.includes(id)}">
        <input class="filter-check" type="checkbox" ${activeGroups.includes(id) ? 'checked' : ''} aria-label="${escapeHtml(label)}">
        <span class="filter-group-title">${escapeHtml(label)}</span>
        ${hasSubtypes && availableTypes.length ? '<span class="filter-chevron">›</span>' : ''}
      </button>
      ${hasSubtypes && availableTypes.length ? `
        <div class="filter-sublist">
          ${availableTypes.map(type => `
            <label class="filter-option">
              <input class="filter-check" type="checkbox" value="${type.id}" ${selectedTypes.includes(type.id) ? 'checked' : ''}>
              <span>${escapeHtml(type.label)}</span>
              <span class="filter-option-count">${type.count}</span>
            </label>
          `).join('')}
        </div>
      ` : ''}
    `;

    const head = group.querySelector('.filter-group-head');
    const groupCheckbox = head.querySelector('input');

    head.addEventListener('click', event => {
      if (event.target === groupCheckbox) return;
      if (!hasSubtypes || !availableTypes.length) {
        toggleGroup(id);
        return;
      }

      toggleExpandedGroup(id);
    });

    groupCheckbox.addEventListener('click', event => {
      event.stopPropagation();
      toggleGroup(id);
    });

    group.querySelectorAll('.filter-sublist input').forEach(input => {
      input.addEventListener('change', () => toggleKnifeType(id, input.value));
    });

    parent.appendChild(group);
  }

  function toggleGroup(id) {
    activeGroups = activeGroups.includes(id)
      ? activeGroups.filter(group => group !== id)
      : [...activeGroups, id];
    renderCatalog();
  }

  function toggleExpandedGroup(id) {
    expandedGroups = expandedGroups.includes(id)
      ? expandedGroups.filter(group => group !== id)
      : [...expandedGroups, id];
    renderFilters();
  }

  function toggleKnifeType(group, type) {
    const selected = activeKnifeTypes[group] || [];
    activeKnifeTypes = {
      ...activeKnifeTypes,
      [group]: selected.includes(type)
        ? selected.filter(value => value !== type)
        : [...selected, type]
    };
    renderCatalog();
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  document.getElementById('search').addEventListener('input', renderCatalog);
  document.getElementById('clearFiltersBtn').addEventListener('click', () => {
    activeGroups = [];
    activeKnifeTypes = { knife: [], knifeGloves: [] };
    priceRange = getDefaultPriceRange();
    renderCatalog();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    activeGroups = [];
    activeKnifeTypes = { knife: [], knifeGloves: [] };
    priceRange = getDefaultPriceRange();
    sortOrder = 'asc';
    document.querySelector('input[name="sortOrder"][value="asc"]').checked = true;
    document.querySelector('input[name="sortOrder"][value="desc"]').checked = false;
    document.getElementById('search').value = '';
    renderCatalog();
  });
  document.getElementById('sortToggle').addEventListener('click', () => {
    const menu = document.getElementById('sortMenu');
    const isOpen = !menu.hidden;
    menu.hidden = isOpen;
    document.getElementById('sortToggle').setAttribute('aria-expanded', String(!isOpen));
  });
  document.querySelectorAll('input[name="sortOrder"]').forEach(input => {
    input.addEventListener('change', () => {
      sortOrder = input.value;
      document.querySelectorAll('input[name="sortOrder"]').forEach(other => {
        other.checked = other === input;
      });
      renderCatalog();
    });
  });
  document.addEventListener('click', event => {
    const sortWrap = event.target.closest('.sort-wrap');
    if (sortWrap) return;

    const menu = document.getElementById('sortMenu');
    menu.hidden = true;
    document.getElementById('sortToggle').setAttribute('aria-expanded', 'false');
  });
  document.getElementById('topBtn').addEventListener('click', () => {
    scrollCatalogToTop('smooth');
  });
  document.getElementById('floatingTopBtn').addEventListener('click', () => {
    scrollCatalogToTop('smooth');
  });
  window.addEventListener('scroll', () => {
    updateScrollTopButtonVisibility();
    markScrollingActivity();
  }, { passive: true });
  document.getElementById('detailView').addEventListener('scroll', markScrollingActivity, { passive: true });

  window.addEventListener('popstate', event => {
    if (typeof event.state?.catalogScrollY === 'number') {
      catalogScrollY = event.state.catalogScrollY;
    }

    selectedItemId = typeof event.state?.itemId === 'number' ? event.state.itemId : getItemIdFromHash();
    renderDetailView();

    if (selectedItemId != null) {
      scrollToDetailView('auto');
      return;
    }

    if (!isMobileDetailLayout()) {
      restoreCatalogScroll('instant');
    }
  });

  window.addEventListener('hashchange', () => {
    const nextItemId = getItemIdFromHash();

    if (nextItemId === selectedItemId) return;

    selectedItemId = nextItemId;
    renderDetailView();

    if (selectedItemId != null) {
      scrollToDetailView('auto');
      return;
    }

    if (!isMobileDetailLayout()) {
      restoreCatalogScroll('instant');
    }
  });

  mobileDetailQuery.addEventListener('change', () => {
    if (selectedItemId == null) return;

    renderDetailView();
    scrollToDetailView('auto');
  });

  renderCatalog();
  renderDetailView();
  updateScrollTopButtonVisibility();

  syncHistoryState(selectedItemId != null ? 'detail' : 'catalog', { fromCatalog: history.state?.fromCatalog });

  if (selectedItemId != null) {
    scrollToDetailView('auto');
  }
</script>
<script>
// Этот код отслеживает нажатия на кнопки покупки
document.addEventListener('click', function (e) {
  const buyButton = e.target.closest('.buy, .tg-btn, .detail-buy');
  
  if (buyButton) {
    gtag('event', 'click_buy_button', {
      'event_category': 'conversion',
      'item_name': buyButton.closest('.card')?.querySelector('.title')?.innerText || 'Unknown Item',
      'destination': buyButton.getAttribute('href')
    });
  }
}, false);
</script>
